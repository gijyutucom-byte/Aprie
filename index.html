<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アプリエ｜AI App Maker</title>
<meta name="description" content="アプリエは、AIとの対話を通してWebアプリの構想・作成・修正・理解を支援する学習・開発ツールです。">
<meta name="theme-color" content="#f7eee7">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="style.css?v=20260926">
</head>
<body>
<main id="home" class="home">
  <section class="hero">
    <img class="app-logo" src="app-icon-192.png" width="168" height="168" alt="アプリエのアイコン">
    <p class="hero-kicker">アイデアをアプリへ ― AI App Maker</p>
    <h1 class="hero-title">アプリエ</h1>
    <p class="lead"><span>AIとの対話を通して、「こんなアプリを作りたい」というアイデアを形にする学習・開発支援ツールです。</span><span>仕様づくりから作成、トラブル解決、仕組みの理解までを順番にサポートします。</span></p>
  </section>

  <section class="choice-grid" aria-label="機能選択">
    <button class="choice-card" type="button" onclick="openTool('spec')">
      <div class="icon">📝</div>
      <h2>①アプリを作る</h2>
      <p>目的・機能・条件・参考資料を整理してアプリ仕様書を生成し、ChatGPT等でアプリを作成します。</p>
    </button>

    <button class="choice-card" type="button" onclick="openTool('trouble')">
      <div class="icon">🛠️</div>
      <h2>②アプリを動かす</h2>
      <p>うまく動かないアプリの状況を整理し、AIへ再依頼する文章を作成します。</p>
    </button>

    <button class="choice-card" type="button" onclick="openTool('understand')">
      <div class="icon">🧭</div>
      <h2>③アプリを理解する</h2>
      <p>仕様と生成されたプログラムから、要件定義書とアクティビティ図を一度に作成します。</p>
    </button>

  </section>
  <p class="footer-note">AIが生成した内容やコードは、使う前に必ず内容・動作・個人情報の扱いを確認してください。</p>
  <div class="bottom-actions"><a class="contact-btn" href="https://mura-lab.info/main/contact" target="_blank" rel="noopener noreferrer">開発者に問い合わせ</a><div class="top-copyright">(c)2026 <a href="https://gijyutu.com/main/" target="_blank" rel="noopener noreferrer">Muramatsu</a>&amp;<a href="https://note.com/ark20202303" target="_blank" rel="noopener noreferrer">Araki</a></div></div>
</main>

<section id="toolShell" class="tool-shell" aria-label="選択した機能">
  <iframe id="toolFrame" title="アプリエ 機能画面"></iframe>
</section>

<script src="script.js"></script></body>
</html>
